name: 06.1. Final Portal Deploy
on:
  push:
    branches:
      - master
    paths:
      - 'docs/**'
      - 'v2-docs/**'
      - 'mkdocs.yml'
      - 'v2-mkdocs.yml'
      - 'requirements.txt'
      - '.github/workflows/06.deploy_final.yml'
  workflow_run:
    workflows:
      - "04.1. V2 Publisher"
      - "09. Weekly Intelligence Digest"
    branches: [master]
    types:
      - completed
  workflow_dispatch: {}

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages-stable"
  cancel-in-progress: false

jobs:
  precheck:
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      should_deploy: ${{ steps.decide.outputs.should_deploy }}
    steps:
      - name: Skip redundant deploy if master HEAD is already deployed
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.event_name }}" != "workflow_run" ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # If triggered by 04.1. V2 Publisher and its publish-v2 job was skipped (no-op PR check), skip deploy
          if [[ "${{ github.event.workflow_run.name }}" == "04.1. V2 Publisher" ]]; then
            PUB_CONCLUSION=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/jobs" \
              --jq '[.jobs[] | select(.name == "publish-v2")] | .[0].conclusion // ""' 2>/dev/null || echo "")
            if [[ "$PUB_CONCLUSION" == "skipped" ]]; then
              echo "Upstream 04.1 publish-v2 job was skipped; skipping deploy."
              echo "should_deploy=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          MASTER_SHA=$(gh api "repos/${{ github.repository }}/git/ref/heads/master" --jq '.object.sha' 2>/dev/null || echo "")
          if [[ -z "$MASTER_SHA" ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ALREADY=$(gh api "repos/${{ github.repository }}/actions/workflows/06.deploy_final.yml/runs?branch=master&per_page=10" \
            --jq "[.workflow_runs[] | select(.id != ${GITHUB_RUN_ID} and .head_sha == \"${MASTER_SHA}\" and (.conclusion == \"success\" or .status == \"in_progress\" or .status == \"queued\"))] | length" \
            2>/dev/null || echo "0")

          if [[ "$ALREADY" -gt 0 ]]; then
            echo "Skipping duplicate deploy: master ($MASTER_SHA) already deployed or queued."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "Deploying updated master ($MASTER_SHA) after upstream [skip ci] publish."
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build Dual Versions
    needs: precheck
    if: needs.precheck.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v7
        with:
          ref: master
          submodules: true
          # Full history so mkdocs-git-revision-date-localized can compute the
          # real per-page "last updated" date (shallow clone => all build-date).
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install mkdocs-material mkdocs-redirects mkdocs-minify-plugin pymdown-extensions
          pip install -r requirements.txt

      # 1. Build V1 to temporary staging area
      - name: Build V1 Edition (Staging)
        run: mkdocs build -f mkdocs.yml -d site_v1/

      # 2. Build V2 Elite Edition (Staging)
      - name: Build V2 Elite Edition (Staging)
        run: mkdocs build -f v2-mkdocs.yml -d site_v2/

      # 3. Assemble Final Site (V2 at Root with V1 Fallback, V1 Archive at /v1/)
      - name: Assemble Final Site
        run: |
          mkdir -p site/

          # Safety check: V2 must have a valid index.html and at least 50 pages
          V2_PAGE_COUNT=$(find site_v2/ -name "*.html" | wc -l)
          if [ "$V2_PAGE_COUNT" -lt 50 ] || [ ! -f site_v2/index.html ]; then
            echo "❌ V2 build looks broken (only $V2_PAGE_COUNT HTML pages). Deploying V1 only to protect the site."
            cp -r site_v1/* site/
            mkdir -p site/v1/
            cp -r site_v1/* site/v1/
            rm -rf site_v1/ site_v2/
            exit 0
          fi

          echo "✅ V2 build OK ($V2_PAGE_COUNT pages). Assembling dual-version site."
          # Copy V1 to root as fallback for any pages not present in V2
          cp -r site_v1/* site/
          # Overwrite root with V2 Elite Portal (matching pages will be V2 versions)
          cp -r site_v2/* site/
          # Deploy full V1 Archive to subdirectory /v1/
          mkdir -p site/v1/
          cp -r site_v1/* site/v1/
          rm -rf site_v1/ site_v2/

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './site'

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

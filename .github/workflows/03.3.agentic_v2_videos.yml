name: 03.3. V2 Video Hub Builder

on:
  push:
    branches:
      - master
    paths:
      - 'src/v2_video_portal.py'
      - 'src/enrich_videos.py'
  schedule:
    - cron: '0 6 1 * *'  # Runs on the 1st of every month at 06:00 UTC (every ~30 days)
  workflow_dispatch:
    inputs:
      restore_cache:
        description: 'Restore inventory from cache (Warning: May overwrite recent manual changes)'
        required: false
        type: boolean
        default: false
      force_enrich:
        description: 'Force AI re-enrichment of all videos (ignores cache)'
        required: false
        type: boolean
        default: false
      skip_ai_enrichment:
        description: 'Render video pages only (0 Gemini/YouTube API calls)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  precheck:
    runs-on: ubuntu-latest
    outputs:
      run_enrichment: ${{ steps.decide.outputs.run_enrichment }}
    steps:
      - name: Decide whether AI video enrichment is needed
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ github.event.inputs.skip_ai_enrichment }}" == "true" ]]; then
              echo "Skipping AI video enrichment (skip_ai_enrichment=true)."
              echo "run_enrichment=false" >> "$GITHUB_OUTPUT"
            else
              echo "run_enrichment=true" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "run_enrichment=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # On push: only invoke Gemini/YouTube enrichment if src/enrich_videos.py changed.
          # Layout/playlist updates in src/v2_video_portal.py render deterministically with 0 AI tokens.
          TOUCHED_ENRICH="false"
          if [[ -n "$BEFORE" && "$BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            TOUCHED_ENRICH=$(gh api "repos/${{ github.repository }}/compare/${BEFORE}...${SHA}" \
              --jq '[.files[]?.filename] | any(. == "src/enrich_videos.py")' 2>/dev/null || echo "")
          fi
          if [[ -z "$TOUCHED_ENRICH" ]]; then
            TOUCHED_ENRICH=$(jq -r '[.commits[]? | (.added[]?, .modified[]?, .removed[]?)] | any(. == "src/enrich_videos.py")' \
              "$GITHUB_EVENT_PATH" 2>/dev/null || echo "false")
          fi

          if [[ "$TOUCHED_ENRICH" == "true" ]]; then
            echo "src/enrich_videos.py changed — running AI video enrichment."
            echo "run_enrichment=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only src/v2_video_portal.py changed — skipping AI enrichment (0 tokens)."
            echo "run_enrichment=false" >> "$GITHUB_OUTPUT"
          fi

  build-video-hub:
    needs: precheck
    runs-on: ubuntu-latest
    concurrency:
      group: v2-videos-master
      cancel-in-progress: false
    steps:
      - name: Repository Synchronization
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Python 3.11 Environment Provisioning
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Restore Incremental Inventory Cache
        if: ${{ github.event.inputs.restore_cache == 'true' }}
        uses: actions/cache/restore@v6
        with:
          path: data/inventory.yaml
          key: inventory-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            inventory-v2-

      - name: Dependency Installation
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml httpx tenacity pytz python-dotenv yt-dlp youtube-transcript-api feedparser

      - name: Execute Video Hub Enrichment
        if: needs.precheck.outputs.run_enrichment == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          FORCE_ENRICH: ${{ github.event.inputs.force_enrich || 'false' }}
        run: |
          set +e
          python src/enrich_videos.py
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -eq 42 ]; then
            echo "⚠️ Video enrichment circuit breaker tripped (Exit 42). Continuing to portal generator with fallback metadata."
          elif [ $EXIT_CODE -ne 0 ]; then
            exit $EXIT_CODE
          fi

      - name: Execute Video Portal Generator
        run: |
          export PYTHONPATH=$PYTHONPATH:.
          python src/v2_video_portal.py

      - name: Commit and Push Video Hub Updates
        run: |
          git config --global user.name "Nubenetes Bot"
          git config --global user.email "bot@nubenetes.com"
          git add data/inventory.yaml data/inventory.sql src/memory/ v2-docs/videos/
          if git diff --staged --quiet; then
            echo "No automated changes to commit."
          else
            git commit -m "docs: update Video Hub with high-fidelity metadata [skip ci]"
            # Retry rebase+push to survive concurrent bot pushes to master.
            for i in {1..5}; do
              if git pull origin master --rebase -X theirs && git push origin master; then
                echo "Successfully rebased and pushed Video Hub updates."
                exit 0
              fi
              echo "Push attempt $i/5 rejected or conflicted — aborting rebase and retrying..."
              git rebase --abort 2>/dev/null || true
              sleep $((i * 3))
            done
            echo "::error::Video Hub push failed after 5 attempts."; exit 1
          fi

      - name: Persist Incremental Inventory Cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: data/inventory.yaml
          key: inventory-v2-${{ github.run_id }}-${{ github.run_attempt }}

name: 09. Weekly Intelligence Digest

on:
  schedule:
    # Every Monday at 06:00 UTC (08:00 Madrid time)
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: develop-git-write-lock
  cancel-in-progress: false

jobs:
  weekly-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Repository Synchronization
        uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0

      - name: Python 3.11 Environment Provisioning
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir pydantic PyGithub httpx fake-useragent pytz python-dotenv pyyaml tenacity
          pip install -r requirements.txt

      - name: Generate News Digest (Incremental)
        env:
          PYTHONPATH: ${{ github.workspace }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
        run: |
          # Incremental engine: reuses stored results for unchanged categories.
          # On Monday, only categories with new entries since the last run
          # (or older than MAX_STALENESS_DAYS=30) trigger Gemini API calls.
          python -u -m src.news_digest

      - name: Generate RSS Feed
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -u -m src.rss_generator || echo "RSS generation skipped"

      - name: Render V2 Portal (Digest Pages Only)
        env:
          PYTHONPATH: ${{ github.workspace }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -u -m src.v2_optimizer --digest-only

      - name: Commit and Push Weekly Digest
        run: |
          git config --global user.name "Nubenetes Bot"
          git config --global user.email "bot@nubenetes.com"
          git add data/news_digest.json v2-docs/tech-digest.md v2-docs/industry-digest.md v2-docs/feed.xml
          if git diff --staged --quiet; then
            echo "No digest changes to commit."
          else
            git commit -m "feat: weekly intelligence digest update [skip ci]"
            # Discard any unstaged or untracked changes so rebase cannot fail
            git checkout -- .
            git clean -fd
            pushed=0
            for i in {1..5}; do
              if git pull origin develop --rebase && git push origin develop; then
                pushed=1
                break
              fi
              echo "Push attempt $i failed, retrying in 10s..."
              sleep 10
            done
            if [ $pushed -eq 0 ]; then
              echo "Failed to push weekly digest after 5 attempts."
              exit 1
            fi
          fi

      - name: Create or Update Promotion PR to Master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git pull origin develop --rebase
          PR_EXISTS=$(gh pr list --head develop --base master --json number --jq '.[0].number')

          if [ -z "$PR_EXISTS" ]; then
            if [ -n "$(git log origin/master..origin/develop --oneline)" ]; then
              echo "Creating new PR from develop to master..."
              gh pr create \
                --base master \
                --head develop \
                --title "🚀 Release: Weekly Intelligence Digest & V2 Portal Update" \
                --body "Automated promotion from develop to master. Includes the latest weekly intelligence digest (`data/news_digest.json`, `v2-docs/tech-digest.md`, `v2-docs/industry-digest.md`) and V2 portal updates."
            else
              echo "develop is already in sync with master. No PR needed."
            fi
          else
            echo "PR #$PR_EXISTS already exists. It is automatically updated with the push to develop."
          fi

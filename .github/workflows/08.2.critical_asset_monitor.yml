name: 08.2. Critical Asset Monitor

on:
  schedule:
    - cron: '0 0 15 2,5,8,11 *' # Mid-Quarter pulse: Feb, May, Aug, Nov 15th
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  monitor-critical:
    runs-on: ubuntu-latest
    concurrency:
      group: critical-asset-monitor-master
      cancel-in-progress: false
    steps:
      - name: Repository Synchronization
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Python 3.11 Environment Provisioning
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Dependencies Installation
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir httpx pytz python-dotenv pyyaml

      - name: Critical Health Audit Execution
        env:
          PYTHONPATH: ${{ github.workspace }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -u -m src.critical_asset_monitor --report-file critical_audit_report.md
          cat critical_audit_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open PR on Inventory Status Changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- data/inventory.sql data/inventory.yaml; then
            echo "[OK] No inventory changes to propose."
            exit 0
          fi

          BRANCH="bot/critical-asset-audit-${GITHUB_RUN_ID}"
          git config --global user.name "Nubenetes Bot"
          git config --global user.email "bot@nubenetes.com"
          git checkout -b "$BRANCH"
          git add data/inventory.sql data/inventory.yaml
          git commit -m "chore(audit): sync critical asset online/offline status"
          git push origin "$BRANCH"

          TITLE="🚨 Critical Asset Health Audit: $(date -u +'%d %b %Y')"
          gh pr create \
            --base master \
            --head "$BRANCH" \
            --title "$TITLE" \
            --body-file critical_audit_report.md

name: 04.1. V2 Publisher

on:
  push:
    branches:
      - develop
    paths:
      - 'docs/**'
  workflow_run:
    workflows: ["03.3. V2 Video Hub Builder"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      restore_cache:
        description: 'Restore inventory from cache (Warning: May overwrite recent manual changes)'
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  precheck:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       !contains(github.event.head_commit.message, '[skip ci]') &&
       !contains(github.event.head_commit.message, 'bot/v2-elite-sync')) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - name: Deduplicate upstream and overlapping triggers
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            # Skip if the triggering 03.3 run skipped its build-video-hub job.
            JOB_CONCL=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/jobs" \
              --jq '[.jobs[] | select(.name == "build-video-hub")] | .[0].conclusion // ""' 2>/dev/null || echo "")
            if [[ "$JOB_CONCL" == "skipped" ]]; then
              echo "Skipping: upstream 03.3 build-video-hub job was skipped as a duplicate."
              echo "should_run=false" >> "$GITHUB_OUTPUT"
            else
              echo "should_run=true" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "push" ]]; then
            # If the push also touches inventory/video scripts, 03.2/03.3 will run
            # and trigger 04.1 via workflow_run after enrichment finishes.
            MATCH="false"
            if [[ -n "$BEFORE" && "$BEFORE" != "0000000000000000000000000000000000000000" ]]; then
              MATCH=$(gh api "repos/${{ github.repository }}/compare/${BEFORE}...${SHA}" \
                --jq '[.files[]?.filename] | any(. == "data/inventory.yaml" or . == "src/v2_video_portal.py" or . == "src/enrich_videos.py")' \
                2>/dev/null || echo "")
            fi
            if [[ -z "$MATCH" ]]; then
              MATCH=$(jq -r '[.commits[]? | (.added[]?, .modified[]?, .removed[]?)] | any(. == "data/inventory.yaml" or . == "src/v2_video_portal.py" or . == "src/enrich_videos.py")' \
                "$GITHUB_EVENT_PATH" 2>/dev/null || echo "false")
            fi
            if [[ "$MATCH" == "true" ]]; then
              echo "Skipping duplicate push trigger: upstream 03.2/03.3 pipeline will trigger 04.1."
              echo "should_run=false" >> "$GITHUB_OUTPUT"
            else
              echo "should_run=true" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          echo "should_run=true" >> "$GITHUB_OUTPUT"

  publish-v2:
    needs: precheck
    runs-on: ubuntu-latest
    if: needs.precheck.outputs.should_run == 'true'
    concurrency:
      group: v2-publish-develop
      cancel-in-progress: false
    steps:
      - name: Repository Synchronization
        uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0

      - name: Python 3.11 Environment Provisioning
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Restore Incremental Inventory Cache
        if: ${{ github.event.inputs.restore_cache == 'true' }}
        uses: actions/cache/restore@v6
        with:
          path: data/inventory.yaml
          key: inventory-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            inventory-v2-

      - name: Installation of Dependencies
        run: |
          pip install --no-cache-dir pydantic PyGithub httpx fake-useragent pytz python-dotenv pyyaml tenacity

      - name: Execute Video Portal Generator
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -u src/v2_video_portal.py

      - name: Execute Mosaic Reorganization
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python src/reorganize_mosaic.py

      - name: Run Deduplication Scan
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -u -c "import asyncio; from src.dedup import run_dedup; asyncio.run(run_dedup(dry_run=False))" || echo "Dedup scan skipped"

      - name: Run Enrichment Pipeline
        env:
          PYTHONPATH: ${{ github.workspace }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -u -m src.enrichment || echo "Enrichment pipeline skipped (no token or error)"

      - name: Generate News Digest (Incremental)
        env:
          PYTHONPATH: ${{ github.workspace }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
        run: |
          # The engine loads news_digest.json from the repo, checks per-cell
          # hashes, and only calls Gemini for categories with new entries or
          # results older than MAX_STALENESS_DAYS (30).  Typical re-runs with
          # no inventory changes cost 0 Gemini API calls.
          python -u -m src.news_digest || echo "News digest generation skipped (no API key or error)"

      - name: Generate RSS Feed
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -u -m src.rss_generator || echo "RSS generation skipped"

      - name: Run V2 Publisher (Render-Only)
        env:
          PYTHONPATH: ${{ github.workspace }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -u -m src.v2_optimizer --render-only
          if [ -f v2_safety_report.md ]; then
            cat v2_safety_report.md >> pr_description.md
          else
            echo "No safety report generated." > pr_description.md
          fi

      - name: Consolidate README Metrics
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m src.readme_updater
          python -m src.safety_readme

      - name: Commit and Push V2 Elite Updates
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          git config --global user.name "Nubenetes Bot"
          git config --global user.email "bot@nubenetes.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No automated changes to commit."
            exit 0
          fi
          git commit -m "feat: sync V2 elite curated edition and README metrics [skip ci]"
          if git push origin develop; then
            echo "Push succeeded on initial attempt."
            exit 0
          fi
          OUR=$(git rev-parse HEAD)
          for i in {1..5}; do
            echo "Publish retry $i/5 after remote advance..."
            git fetch origin develop
            git reset --hard origin/develop
            git checkout "$OUR" -- data/news_digest.json || true
            python -u src/v2_video_portal.py
            python src/reorganize_mosaic.py
            python -u -m src.rss_generator || true
            python -u -m src.v2_optimizer --render-only
            python -m src.readme_updater
            python -m src.safety_readme
            git add -A
            if git diff --staged --quiet; then
              echo "Remote already matches this render. Nothing to push."
              exit 0
            fi
            git commit -m "feat: sync V2 elite curated edition and README metrics [skip ci]"
            if git push origin develop; then
              echo "Push succeeded on attempt $i."
              exit 0
            fi
            echo "Attempt $i rejected — remote advanced, retrying from fresh tip..."
            sleep $((i * 3))
          done
          echo "::error::V2 publish push failed after 5 attempts (persistent write contention on develop)."
          exit 1

      - name: Create or Update Promotion PR to Master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git pull origin develop --rebase
          # Check if a PR already exists
          PR_EXISTS=$(gh pr list --head develop --base master --json number --jq '.[0].number')
          
          if [ -z "$PR_EXISTS" ]; then
            echo "Creating new PR from develop to master..."
            gh pr create \
              --base master \
              --head develop \
              --title "🚀 Release: Agentic V2 Portal Update" \
              --body "Automated promotion from develop to master. This PR includes updated V2 Elite portal content, AI-enriched metadata, and synchronized README metrics. Please review and merge to deploy to production."
          else
            echo "PR #$PR_EXISTS already exists. No action needed (it will auto-update with the push)."
          fi

      - name: Upload Architecture and Decision Logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v2-agentic-logs
          path: |
            v2_file_audit.md
            v2_decision_matrix.md
            v2_safety_report.md
          if-no-files-found: ignore

      - name: Persist Incremental Inventory to Cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: data/inventory.yaml
          key: inventory-v2-${{ github.run_id }}-${{ github.run_attempt }}

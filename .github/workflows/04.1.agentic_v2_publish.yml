name: 04.1. V2 Publisher

# Strictly 0-AI-token deterministic publisher.
# - Renders V2 portal pages (--render-only) from docs/ + data/inventory.yaml.
# - AI enrichment lives exclusively in 03.2. V2 AI Curator (scheduled/manual).
# - AI News Digest lives exclusively in 09. Weekly Intelligence Digest.
on:
  push:
    branches:
      - master
    paths:
      - 'docs/**'
  workflow_run:
    workflows:
      - "03.2. V2 AI Curator"
      - "03.3. V2 Video Hub Builder"
    branches: [master]
    types:
      - completed
  workflow_dispatch:
    inputs:
      restore_cache:
        description: 'Restore inventory from cache (Warning: May overwrite recent manual changes)'
        required: false
        type: boolean
        default: false
      run_enrichment:
        description: 'Run GitHub/CNCF metadata enrichment (default: false — handled by 03.1)'
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  precheck:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       !contains(github.event.head_commit.message, '[skip ci]') &&
       !contains(github.event.head_commit.message, 'bot/v2-elite-sync')) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - name: Deduplicate upstream and pre-rendered triggers
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            # Skip if the triggering job was skipped as a duplicate.
            JOB_CONCL=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/jobs" \
              --jq '[.jobs[] | select(.name == "build-video-hub" or .name == "run-ai")] | .[0].conclusion // ""' 2>/dev/null || echo "")
            if [[ "$JOB_CONCL" == "skipped" ]]; then
              echo "Skipping: upstream job was skipped."
              echo "should_run=false" >> "$GITHUB_OUTPUT"
            else
              echo "should_run=true" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "push" ]]; then
            FILES_JSON=""
            if [[ -n "$BEFORE" && "$BEFORE" != "0000000000000000000000000000000000000000" ]]; then
              FILES_JSON=$(gh api "repos/${{ github.repository }}/compare/${BEFORE}...${SHA}" \
                --jq '[.files[]?.filename]' 2>/dev/null || echo "")
            fi
            if [[ -z "$FILES_JSON" ]]; then
              FILES_JSON=$(jq -c '[.commits[]? | (.added[]?, .modified[]?, .removed[]?)]' \
                "$GITHUB_EVENT_PATH" 2>/dev/null || echo "[]")
            fi

            # 1. If video scripts changed, 03.3 will run and chain into 04.1.
            VIDEO_MATCH=$(echo "$FILES_JSON" | jq 'any(. == "src/v2_video_portal.py" or . == "src/enrich_videos.py")')
            if [[ "$VIDEO_MATCH" == "true" ]]; then
              echo "Skipping duplicate push trigger: upstream 03.3 video pipeline will trigger 04.1."
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # 2. If the push already includes pre-rendered v2-docs/** changes (e.g., maintainer
            #    or agent PR that ran v2_optimizer --render-only locally), skip 04.1 so 06.1
            #    deploys directly in a single pass with 0 redundant bot commits.
            V2_PRE_RENDERED=$(echo "$FILES_JSON" | jq 'any(startswith("v2-docs/"))')
            if [[ "$V2_PRE_RENDERED" == "true" ]]; then
              echo "Skipping: commit already includes pre-rendered v2-docs/ updates (06.1 will deploy directly)."
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # 3. Otherwise (e.g., contributor PR editing only docs/*.md), run 04.1 render-only.
            echo "docs/ updated without v2-docs/ — running 0-token V2 render-only publish."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_run=true" >> "$GITHUB_OUTPUT"

  publish-v2:
    needs: precheck
    runs-on: ubuntu-latest
    if: needs.precheck.outputs.should_run == 'true'
    concurrency:
      group: v2-publish-master
      cancel-in-progress: false
    steps:
      - name: Repository Synchronization
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - name: Python 3.11 Environment Provisioning
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Restore Incremental Inventory Cache
        if: ${{ github.event.inputs.restore_cache == 'true' }}
        uses: actions/cache/restore@v6
        with:
          path: data/inventory.yaml
          key: inventory-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            inventory-v2-

      - name: Installation of Dependencies
        run: |
          pip install --no-cache-dir pydantic PyGithub httpx fake-useragent pytz python-dotenv pyyaml tenacity

      - name: Execute Video Portal Generator
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -u src/v2_video_portal.py

      - name: Execute Mosaic Reorganization
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python src/reorganize_mosaic.py

      - name: Run Deduplication Scan
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -u -c "import asyncio; from src.dedup import run_dedup; asyncio.run(run_dedup(dry_run=False))" || echo "Dedup scan skipped"

      - name: Run Enrichment Pipeline (Opt-In Manual Only)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_enrichment == 'true' }}
        env:
          PYTHONPATH: ${{ github.workspace }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -u -m src.enrichment || echo "Enrichment pipeline skipped (no token or error)"

      - name: Generate RSS Feed
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -u -m src.rss_generator || echo "RSS generation skipped"

      - name: Run V2 Publisher (Render-Only)
        env:
          PYTHONPATH: ${{ github.workspace }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -u -m src.v2_optimizer --render-only

      - name: Consolidate README Metrics
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m src.readme_updater
          python -m src.safety_readme

      - name: Commit and Push V2 Elite Updates
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          git config --global user.name "Nubenetes Bot"
          git config --global user.email "bot@nubenetes.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No automated changes to commit."
            exit 0
          fi
          git commit -m "feat: sync V2 elite curated edition and README metrics [skip ci]"
          if git push origin master; then
            echo "Push succeeded on initial attempt."
            exit 0
          fi
          OUR=$(git rev-parse HEAD)
          for i in {1..5}; do
            echo "Publish retry $i/5 after remote advance..."
            git fetch origin master
            git reset --hard origin/master
            git checkout "$OUR" -- data/news_digest.json || true
            python -u src/v2_video_portal.py
            python src/reorganize_mosaic.py
            python -u -m src.rss_generator || true
            python -u -m src.v2_optimizer --render-only
            python -m src.readme_updater
            python -m src.safety_readme
            git add -A
            if git diff --staged --quiet; then
              echo "Remote already matches this render. Nothing to push."
              exit 0
            fi
            git commit -m "feat: sync V2 elite curated edition and README metrics [skip ci]"
            if git push origin master; then
              echo "Push succeeded on attempt $i."
              exit 0
            fi
            echo "Attempt $i rejected — remote advanced, retrying from fresh tip..."
            sleep $((i * 3))
          done
          echo "::error::V2 publish push failed after 5 attempts (persistent write contention on master)."
          exit 1

      - name: Upload Architecture and Decision Logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v2-agentic-logs
          path: |
            v2_file_audit.md
            v2_decision_matrix.md
            v2_safety_report.md
          if-no-files-found: ignore

      - name: Persist Incremental Inventory to Cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: data/inventory.yaml
          key: inventory-v2-${{ github.run_id }}-${{ github.run_attempt }}
